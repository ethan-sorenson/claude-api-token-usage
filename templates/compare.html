<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison Chat - Side by Side</title>
    <link rel="icon" type="image/png" sizes="16x16" href="https://login.popdock.com/favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/compare.css?v=20260219f">
    <link rel="stylesheet" href="/static/css/nav.css?v=20260219">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
</head>
<body>
    <!-- Nav Drawer -->
    <div class="nav-overlay" id="navOverlay" onclick="toggleNavMenu()"></div>
    <nav class="nav-drawer" id="navDrawer">
        <div class="nav-drawer-header">
            <span class="app-icon">🤖</span>
            <h2>MCP Chat</h2>
        </div>
        <div class="nav-section">
            <div class="nav-section-label">Configuration</div>
            <a class="nav-item" href="/tokens">
                <span class="nav-icon">🔑</span>
                <span class="nav-label">AI Clients</span>
            </a>
            <a class="nav-item" href="/connections">
                <span class="nav-icon">🔌</span>
                <span class="nav-label">Connections</span>
            </a>
        </div>
        <div class="nav-divider"></div>
        <div class="nav-section">
            <div class="nav-section-label">Chats</div>
            <a class="nav-item" href="/">
                <span class="nav-icon">💬</span>
                <span class="nav-label">Single Chat</span>
            </a>
            <a class="nav-item active" href="/compare.html">
                <span class="nav-icon">🔀</span>
                <span class="nav-label">Comparison Chat</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="nav-menu-trigger" id="navMenuTrigger" onclick="toggleNavMenu()" title="Menu">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
                <h1 style="margin: 0;">🔀 Comparison Chat</h1>
            </div>
        </div>

        <div class="comparison-main">
            <div class="right-sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-section-title">📋 Session</div>
                    <div id="currentSessionInfo" class="sidebar-session-info">
                        No active session
                    </div>
                    <div id="sessionNoteContainer" style="display: none;">
                        <input type="text" id="comparisonNote" class="sidebar-input" placeholder="Session note..." onchange="saveComparisonSession()">
                    </div>
                    <div class="sidebar-session-buttons">
                        <button class="sidebar-btn" onclick="startNewComparison()" title="New Comparison">➕ New</button>
                        <button class="sidebar-btn" onclick="showComparisonHistory()" title="Load Session">📁 Load</button>
                        <button class="sidebar-btn sidebar-btn-danger" onclick="resetComparison()" title="Reset">🔄 Reset</button>
                    </div>
                </div>
                <div class="sidebar-section">
                    <div class="sidebar-section-title">📊 Performance Comparison</div>
                    <div id="sidebarComparisonMetrics"></div>
                </div>
            </div>

            <div class="config-bar" id="configBar">
                <div class="config-inline">
                    <div class="config-group config-a-accent">
                        <span class="config-group-label">🟢 A</span>
                        <div id="leftClientSelector" class="client-selector"></div>
                        <div class="mcp-selector" id="leftMcpSelector"></div>
                        <button class="history-btn-sm" onclick="showMessageHistory('left')" title="View message history">
                            📋 <span id="leftMessageCount">0</span>
                        </button>
                    </div>
                    <div class="config-group config-b-accent">
                        <span class="config-group-label">🔵 B</span>
                        <div id="rightClientSelector" class="client-selector"></div>
                        <div class="mcp-selector" id="rightMcpSelector"></div>
                        <button class="history-btn-sm" onclick="showMessageHistory('right')" title="View message history">
                            📋 <span id="rightMessageCount">0</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="side-panel config-a" id="leftPanel">
                <div class="panel-label">🟢 A <span id="leftPanelName" class="panel-config-name"></span></div>
                <div class="messages-container" id="leftMessages"></div>
                <div class="metrics-bar">
                    <div class="metrics-row">
                        <div class="metric-item"><span class="metric-label">Tokens:</span><span id="leftTokens">0</span></div>
                        <div class="metric-item"><span class="metric-label">Time:</span><span id="leftTime">0s</span></div>
                        <div class="metric-item"><span class="metric-label">Cost:</span><span id="leftCost">$0.00</span></div>
                    </div>
                </div>
            </div>

            <div class="side-panel config-b" id="rightPanel">
                <div class="panel-label">🔵 B <span id="rightPanelName" class="panel-config-name"></span></div>
                <div class="messages-container" id="rightMessages"></div>
                <div class="metrics-bar">
                    <div class="metrics-row">
                        <div class="metric-item"><span class="metric-label">Tokens:</span><span id="rightTokens">0</span></div>
                        <div class="metric-item"><span class="metric-label">Time:</span><span id="rightTime">0s</span></div>
                        <div class="metric-item"><span class="metric-label">Cost:</span><span id="rightCost">$0.00</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-section">
            <div id="errorContainer"></div>
            <div class="input-controls">
                <button class="markdown-toggle" onclick="toggleMarkdownPreview()" title="Toggle Markdown Preview">👁️ Preview</button>
            </div>
            <div style="display: flex; gap: 10px; align-items: flex-end;">
                <div class="input-wrapper">
                    <textarea id="userInput" class="config-input" placeholder="Type your message here (Markdown supported)..." onkeydown="handleKeyPress(event)" oninput="updateMarkdownPreview()" style="flex: 1; margin: 0; min-height: 80px; max-height: 400px; resize: vertical;"></textarea>
                    <div id="markdownPreview" class="markdown-preview" style="display: none;"></div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button class="btn btn-primary" onclick="sendComparison()" style="padding: 14px 28px; font-size: 15px; font-weight: 600; white-space: nowrap;">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Comparison Modal -->
    <div id="loadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Load Comparison Session</h2>
                <button class="close" onclick="closeLoadModal()">&times;</button>
            </div>
            <div class="modal-body"><div id="sessionList"></div></div>
        </div>
    </div>

    <!-- Message History Modal -->
    <div id="messageHistoryModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow: auto;">
        <div style="background: white; margin: 30px auto; max-width: 1000px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 85vh; display: flex; flex-direction: column;">
            <div style="padding: 20px; border-bottom: 1px solid #E2E2E4; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin: 0; font-size: 20px;" id="historyModalTitle">Message History</h2>
                <button onclick="closeMessageHistoryModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #929395;">&times;</button>
            </div>
            <div style="padding: 20px; overflow-y: auto; flex: 1;"><div id="messageHistoryContent"></div></div>
        </div>
    </div>

    <!-- Message Details Modal -->
    <div id="messageDetailsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1001; overflow: auto;">
        <div style="background: white; margin: 30px auto; max-width: 900px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 85vh; display: flex; flex-direction: column;">
            <div style="padding: 20px; border-bottom: 1px solid #E2E2E4; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin: 0; font-size: 20px;">API Call Details</h2>
                <button onclick="closeMessageDetailsModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #929395;">&times;</button>
            </div>
            <div style="padding: 20px; overflow-y: auto; flex: 1;"><div id="messageDetailsContent"></div></div>
        </div>
    </div>

    <script src="/static/js/shared.js?v=20260220a"></script>
    <script src="/static/js/compare.js?v=20260219e"></script>
</body>
</html>
