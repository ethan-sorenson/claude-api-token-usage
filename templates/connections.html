<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections - MCP Chat</title>
    <link rel="icon" type="image/png" sizes="16x16" href="https://login.popdock.com/favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/main.css?v=20260225b">
    <link rel="stylesheet" href="/static/css/nav.css?v=20260225b">
    <link rel="stylesheet" href="/static/css/connections.css?v=20260225b">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Nav Drawer -->
    <div class="nav-overlay" id="navOverlay" onclick="toggleNavMenu()"></div>
    <nav class="nav-drawer" id="navDrawer">
        <div class="nav-drawer-header">
            <span class="app-icon">MC</span>
            <h2>MCP Chat</h2>
        </div>
        <div class="nav-section">
            <div class="nav-section-label">Configuration</div>
            <a class="nav-item" href="/tokens">
                <span class="nav-icon">//</span>
                <span class="nav-label">AI Clients</span>
            </a>
            <a class="nav-item active" href="/connections">
                <span class="nav-icon">~~</span>
                <span class="nav-label">Connections</span>
            </a>
        </div>
        <div class="nav-divider"></div>
        <div class="nav-section">
            <div class="nav-section-label">Chats</div>
            <a class="nav-item" href="/">
                <span class="nav-icon">&gt;_</span>
                <span class="nav-label">Single Chat</span>
            </a>
            <a class="nav-item" href="/compare.html">
                <span class="nav-icon">&lt;&gt;</span>
                <span class="nav-label">Comparison Chat</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <div class="header-left">
                <div class="header-top-row">
                    <button class="nav-menu-trigger" id="navMenuTrigger" onclick="toggleNavMenu()" title="Menu">
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                    </button>
                    <h1>Connections</h1>
                </div>
                <p class="page-subtitle">Manage MCP server connections available in the chat interfaces.</p>
            </div>
        </div>

        <div class="page-content">
            <div class="toolbar">
                <div class="toolbar-left">
                    <button class="btn btn-primary" onclick="addMcpServer()">
                        + Add New Server
                    </button>
                    <button class="btn btn-secondary" onclick="testAllMcpConnections()">
                        ~~ Test All Connections
                    </button>
                </div>
                <div class="toolbar-right">
                    <div id="mcpStatus" class="status-indicator status-disconnected">
                        <span>●</span> No servers configured
                    </div>
                </div>
            </div>

            <div class="connections-split">
                <div class="connections-list-panel">
                    <div id="mcpServersList" class="server-list"></div>
                </div>
                <div class="connections-detail-panel" id="serverDetailPanel">
                    <div class="detail-empty">
                        <div class="detail-empty-icon">~~</div>
                        <p>Select a server from the list to view its configuration</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MCP Capabilities Modal -->
    <div id="mcpCapabilitiesModal" class="modal-backdrop">
        <div class="modal-dialog modal-dialog--lg">
            <div class="modal-header">
                <h2 id="modalServerName">MCP Server Capabilities</h2>
                <button onclick="closeMcpCapabilitiesModal()" class="modal-close">&times;</button>
            </div>
            <div class="modal-search">
                <input type="text" id="capabilitiesSearch" placeholder="Search tools and prompts..."
                       oninput="filterCapabilities()">
                <button onclick="clearCapabilitiesSearch()" id="clearSearchBtn" class="modal-search-clear" style="display:none;">&times;</button>
            </div>
            <div class="modal-body">
                <div id="modalContent"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/shared.js?v=20260220b"></script>
    <script src="/static/js/connections.js?v=20260220b"></script>
</body>
</html>
