<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections - MCP Chat</title>
    <link rel="icon" type="image/png" sizes="16x16" href="https://login.popdock.com/favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css?v=20260220b">
    <link rel="stylesheet" href="/static/css/nav.css?v=20260220b">
    <link rel="stylesheet" href="/static/css/connections.css?v=20260220b">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Nav Drawer -->
    <div class="nav-overlay" id="navOverlay" onclick="toggleNavMenu()"></div>
    <nav class="nav-drawer" id="navDrawer">
        <div class="nav-drawer-header">
            <span class="app-icon">🤖</span>
            <h2>MCP Chat</h2>
        </div>
        <div class="nav-section">
            <div class="nav-section-label">Configuration</div>
            <a class="nav-item" href="/tokens">
                <span class="nav-icon">🔑</span>
                <span class="nav-label">AI Clients</span>
            </a>
            <a class="nav-item active" href="/connections">
                <span class="nav-icon">🔌</span>
                <span class="nav-label">Connections</span>
            </a>
        </div>
        <div class="nav-divider"></div>
        <div class="nav-section">
            <div class="nav-section-label">Chats</div>
            <a class="nav-item" href="/">
                <span class="nav-icon">💬</span>
                <span class="nav-label">Single Chat</span>
            </a>
            <a class="nav-item" href="/compare.html">
                <span class="nav-icon">🔀</span>
                <span class="nav-label">Comparison Chat</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <div class="header-left">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="nav-menu-trigger" id="navMenuTrigger" onclick="toggleNavMenu()" title="Menu">
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                    </button>
                    <h1 style="margin-bottom: 0;">🔌 Connections</h1>
                </div>
                <p class="page-subtitle">Manage MCP server connections available in the chat interfaces.</p>
            </div>
        </div>

        <div class="page-content">
            <div class="toolbar">
                <div class="toolbar-left">
                    <button class="btn btn-primary" onclick="addMcpServer()">
                        ➕ Add New Server
                    </button>
                    <button class="btn btn-secondary" onclick="testAllMcpConnections()">
                        🔌 Test All Connections
                    </button>
                </div>
                <div class="toolbar-right">
                    <div id="mcpStatus" class="status-indicator status-disconnected">
                        <span>●</span> No servers configured
                    </div>
                </div>
            </div>

            <div class="connections-split">
                <div class="connections-list-panel">
                    <div id="mcpServersList" class="server-list"></div>
                </div>
                <div class="connections-detail-panel" id="serverDetailPanel">
                    <div class="detail-empty">
                        <div class="detail-empty-icon">🔌</div>
                        <p>Select a server from the list to view its configuration</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MCP Capabilities Modal -->
    <div id="mcpCapabilitiesModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow: auto;">
        <div style="background: white; margin: 50px auto; max-width: 1200px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 80vh; display: flex; flex-direction: column;">
            <div style="padding: 20px; border-bottom: 1px solid #E2E2E4;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2 style="margin: 0; font-size: 20px;" id="modalServerName">MCP Server Capabilities</h2>
                    <button onclick="closeMcpCapabilitiesModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #929395;">&times;</button>
                </div>
                <div style="position: relative;">
                    <input type="text" id="capabilitiesSearch" placeholder="🔍 Search tools and prompts..." 
                           oninput="filterCapabilities()"
                           style="width: 100%; padding: 10px 40px 10px 15px; border: 1px solid #E2E2E4; border-radius: 6px; font-size: 14px; outline: none;">
                    <button onclick="clearCapabilitiesSearch()" id="clearSearchBtn"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #929395; cursor: pointer; font-size: 18px; display: none;">&times;</button>
                </div>
            </div>
            <div style="padding: 20px; overflow-y: auto; flex: 1;">
                <div id="modalContent"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/shared.js?v=20260220b"></script>
    <script src="/static/js/connections.js?v=20260220b"></script>
</body>
</html>
